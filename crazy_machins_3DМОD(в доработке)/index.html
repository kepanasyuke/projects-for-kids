<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Мастерская Профессора Шестеренкина</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{--bg:#34261c;--panel:linear-gradient(150deg,#4a3426,#2a1e16);--border:#6a4a34;--accent:#d6a060;--surface:#5c3f2e;--metal:#9a8068;--dark:#1e1410;--light:#e8dcd0;--ok:#4a8a4a;--bad:#b85040}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Nunito',sans-serif;color:var(--light);display:flex}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--dark)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

#panel{width:520px;min-width:520px;height:100%;background:var(--panel);border-right:3px solid var(--border);display:flex;flex-direction:column;padding:14px 18px 12px 18px;z-index:10;position:relative;overflow:hidden}
#panel::after{content:'';position:absolute;bottom:-40px;right:-40px;width:180px;height:180px;border-radius:50%;border:2px solid var(--border);opacity:.06;pointer-events:none}

.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:2px solid var(--border);margin-bottom:8px}
.top h1{font-size:14px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--light)}
.top h1 span{color:var(--accent)}

.lvl-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.lvl-bar .info{font-size:10px;color:var(--metal);letter-spacing:1px;font-weight:700}
.lvl-bar .btns{display:flex;gap:4px}
.lvl-btn{background:var(--dark);border:1px solid var(--border);color:var(--metal);padding:4px 12px;font-size:9px;font-weight:700;cursor:pointer;border-radius:6px;transition:.2s;text-transform:uppercase;letter-spacing:1px;font-family:'Nunito',sans-serif}
.lvl-btn:hover{color:var(--light);background:var(--surface)}

.assist{display:flex;gap:8px;background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:7px 10px;margin-bottom:8px;min-height:44px}
.assist .port{width:28px;height:28px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--accent)}
.assist .txt{font-size:11.5px;line-height:1.5;color:var(--metal);padding:2px 0}
.assist .txt b{color:var(--light);font-weight:700}
.assist .txt .h{color:var(--accent);font-weight:600}

.tblock{background:var(--dark);border:1px solid var(--border);border-radius:8px;padding:7px 10px;margin-bottom:8px;display:flex;align-items:flex-start;gap:6px}
.tblock .t{font-size:11px;color:var(--metal);line-height:1.5}
.tblock .t b{color:var(--light);font-weight:700}

.sg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:6px}
.sc{background:var(--dark);border:1px solid var(--border);border-radius:6px;padding:5px 8px}
.sc .l{font-size:8px;text-transform:uppercase;letter-spacing:1px;color:var(--metal);font-weight:700;display:block}
.sc .v{font-size:13px;font-weight:700;color:var(--light);font-family:'JetBrains Mono',monospace}
#tmr{color:var(--accent);font-size:14px}

.chn{display:flex;align-items:center;gap:6px;background:var(--dark);border:1px solid var(--border);border-radius:6px;padding:5px 10px;margin-bottom:8px}
.chn-d{width:6px;height:6px;border-radius:50%;background:var(--surface);flex-shrink:0;transition:.3s}
.chn-d.ok{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.chn-d.bd{background:var(--bad);box-shadow:0 0 6px var(--bad)}
.chn .l{font-size:9px;letter-spacing:1px;color:var(--metal);font-weight:700;text-transform:uppercase}
#chs{font-size:11px;font-weight:700;letter-spacing:.5px;margin-left:auto;color:var(--bad);transition:.3s;font-family:'JetBrains Mono',monospace}

.es{flex:1;display:flex;flex-direction:column;margin-bottom:6px;min-height:0}
.es label{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--metal);margin-bottom:4px;font-weight:700}
.ew{flex:1;display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--dark);min-height:60px}
.ln{width:28px;background:var(--dark);border-right:1px solid var(--border);padding:6px 0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.7;color:var(--surface);user-select:none;overflow:hidden}
.ei{flex:1;position:relative;overflow:hidden}
.hl{position:absolute;top:0;left:0;right:0;padding:6px 10px;margin:0;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7;color:var(--light);white-space:pre-wrap;word-wrap:break-word;pointer-events:none;overflow:hidden;z-index:1;min-height:100%;transform:translateY(0)}
.hl .kw{color:#7ab6e8}.hl .op{color:var(--metal)}.hl .st{color:var(--accent)}.hl .tr{color:var(--ok);font-weight:700}.hl .fa{color:var(--bad);font-weight:700}.hl .br{color:var(--metal)}.hl .cm{color:var(--surface);font-style:italic}
#ta{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;padding:6px 10px;background:transparent;border:none;resize:none;outline:none;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7;color:transparent;caret-color:var(--accent);user-select:text;overflow:auto;white-space:pre-wrap;word-wrap:break-word;scrollbar-width:thin;scrollbar-color:var(--border) var(--dark)}
#ta::-webkit-scrollbar{width:8px}
#ta::-webkit-scrollbar-track{background:var(--dark)}
#ta::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.chips{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;align-items:stretch;max-height:120px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--border) var(--dark);padding-right:4px;min-height:0}
.chip{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;padding:4px 8px;border-radius:6px;cursor:pointer;transition:.15s;border:1px solid var(--border);background:var(--dark);color:var(--metal);display:flex;flex-direction:column;gap:2px;min-width:64px;position:relative}
.chip::before{content:'';position:absolute;left:0;top:2px;bottom:2px;width:3px;border-radius:2px;background:transparent;transition:.25s}
.chip.val-good{border-color:var(--ok)}.chip.val-good::before{background:var(--ok)}
.chip.val-bad-chip{border-color:var(--bad)}.chip.val-bad-chip::before{background:var(--bad)}
.chip:hover{color:var(--light);background:var(--surface)}
.chip .pn{font-size:9px;color:var(--metal);text-transform:uppercase;letter-spacing:.5px}
.chip .pv{font-size:11px;font-weight:700;color:var(--light);transition:.2s}
.chip .ph{font-size:8.5px;color:var(--accent);font-style:italic}
.chip .val-ok{color:var(--ok)}.chip .val-bad{color:var(--bad)}
.chip.op{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:6px;min-width:auto}
.chip .pmn,.chip .ppl{font-size:13px;font-weight:700;color:var(--accent);padding:0 5px;cursor:pointer;user-select:none}
.chip .pmn:hover,.chip .ppl:hover{color:var(--light)}
.chip .ci{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--light);font-family:'JetBrains Mono',monospace;font-size:11px;padding:2px 4px;box-sizing:border-box;outline:none}
.chip .ci:focus{border-color:var(--accent)}
.chip.flash{animation:chFlash .4s ease-out}
@keyframes chFlash{0%{box-shadow:0 0 0 2px var(--accent);background:var(--surface)}100%{box-shadow:0 0 0 0 transparent;background:var(--dark)}}

.lg{background:var(--dark);border:1px solid var(--border);border-radius:6px;padding:5px 10px;margin-bottom:6px;min-height:26px;display:flex;align-items:center}
.lg p{font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.4;color:var(--metal);white-space:pre-wrap;word-wrap:break-word;max-height:26px;overflow-y:auto}

.pb{width:100%;height:4px;background:var(--dark);border-radius:4px;margin-bottom:6px;overflow:hidden}
.pb-b{height:100%;width:0%;background:linear-gradient(90deg,var(--ok),var(--accent));transition:width .25s;border-radius:4px}

.btn{width:100%;padding:12px;background:linear-gradient(180deg,#6a4a34,#3d2b1f);border:2px solid var(--border);border-radius:8px;color:var(--light);font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:2px;cursor:pointer;transition:.15s;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(0,0,0,.5)}
.btn:active{transform:translateY(1px)}

#vp{flex:1;position:relative;background:var(--bg);overflow:hidden}

#gate{position:absolute;top:0;left:0;width:100%;height:100%;z-index:100;background:rgba(20,12,8,.92);display:flex;justify-content:center;align-items:center;transition:transform .8s cubic-bezier(.65,0,.35,1)}
.gb{background:var(--panel);border:2px solid var(--border);padding:28px 34px;width:430px;text-align:center;border-radius:14px;box-shadow:0 30px 60px rgba(0,0,0,.7);max-height:92vh;overflow-y:auto}
.gb h1{font-size:21px;font-weight:800;letter-spacing:1px;color:var(--light);border-bottom:2px solid var(--border);padding-bottom:12px;margin-bottom:8px}
.gb h1 span{color:var(--accent)}
.gb .slv{font-size:10px;color:var(--metal);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;font-weight:600}
.gb .sd{font-size:13px;color:var(--metal);margin-bottom:8px;line-height:1.6}
.gb .spat{background:var(--dark);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:11px;margin:6px 0 12px;color:var(--accent);line-height:1.7;text-align:left}
.gb label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--metal);text-align:left;margin-bottom:4px;font-weight:700}
.gb input{width:100%;padding:10px 14px;background:var(--dark);border:1px solid var(--border);border-radius:6px;color:var(--light);font-family:'Nunito',sans-serif;font-size:15px;outline:none;transition:border .2s;font-weight:600}
.gb input:focus{border-color:var(--accent)}
.gb .b2{width:100%;padding:11px;background:linear-gradient(180deg,var(--surface),var(--dark));border:1px solid var(--border);border-radius:6px;color:var(--light);font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:2px;cursor:pointer;margin-top:10px;transition:.2s}
.gb .b2:hover{opacity:.85}
.gb .b2.sm{font-size:9px;letter-spacing:1px;padding:8px;margin-top:6px;background:var(--dark);border-color:var(--metal);color:var(--metal)}
.gb .b2.sm:hover{color:var(--light)}
</style>
</head>
<body>

<div id="gate"><div class="gb" id="gate-inner"></div></div>

<div id="panel">
  <div class="top">
    <h1>Мастерская <span>Шестеренкина</span></h1>
  </div>

  <div class="lvl-bar">
    <span class="info" id="lvl-info"></span>
    <div class="btns">
      <button class="lvl-btn" id="pv">Назад</button>
      <button class="lvl-btn" id="nx">Далее</button>
    </div>
  </div>

  <div class="assist"><div class="port">Ш</div><div class="txt" id="ast"></div></div>
  <div class="tblock"><span class="t" id="task"></span></div>

  <div class="sg">
    <div class="sc"><span class="l">Инженер</span><span class="v" id="en">—</span></div>
    <div class="sc"><span class="l">Время</span><span class="v" id="tmr">00:00.00</span></div>
    <div class="sc"><span class="l">Цель</span><span class="v" id="cnt">—</span></div>
  </div>

  <div class="chn"><span class="chn-d" id="chd"></span><span class="l">Статус</span><span id="chs">ГОТОВО</span></div>

  <div class="es">
    <label>РЕГИСТРЫ СИСТЕМЫ</label>
    <div class="ew">
      <div class="ln" id="ln"></div>
      <div class="ei"><pre class="hl" id="hl"></pre><textarea id="ta" spellcheck="false"></textarea></div>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="lg"><p id="lg">% Журнал: ожидание запуска...</p></div>
  <div class="pb"><div class="pb-b" id="pb" style="width:0%"></div></div>
  <button class="btn" id="sb" onclick="startRun()">Запустить механизм</button>
  <button class="btn" id="sb2" onclick="checkExtra2()" style="margin-top:6px;display:none">Проверить настройки</button>
  <button class="btn" id="sb3" onclick="checkExtra3()" style="margin-top:6px;display:none">Калибровка</button>
</div>

<div id="vp"></div>

<script type="module">
import*as THREE from'three';import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';import{RenderPass}from'three/addons/postprocessing/RenderPass.js';import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';import{SSAOPass}from'three/addons/postprocessing/SSAOPass.js';import{OutputPass}from'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   УРОВНИ: тип 'nodes' — конвейер с 12 узлами true/false (ур.1)
           тип 'goal'  — цель механизма Crazy Machines (ур.2-8)
   ============================================================ */
const LVLS=[
{num:1,nm:'Конвейер',kind:'nodes',sc:'stair',goal:'Открыть все 12 стопоров',desc:'Шар катится по деревянной лесенке. Каждый узел пропускает шар только если регистр равен true.',task:'Измените регистры 2-12: вместо <span class="h" style="color:var(--bad)">false</span> поставьте <span class="h" style="color:var(--ok)">true</span>.',w:'all',hint:'Смотрите в код: для каждого узла написано false. Замените на true и запустите механизм.'},
{num:2,nm:'Лампочка',kind:'goal',sc:'abyss',goal:'Зажечь лампочку',desc:'Рельс обрывается над бездной. Вилка падает на стальную плиту с розеткой — лампочка загорится, если напряжение ровно 220 вольт и цепь замкнута.',task:'Подайте <b>220</b> вольт (сейчас 110) и замкните цепь.',ch:'═══ ЦЕХ 2 · ЭНЕРГЕТИКА ═══\n1 ● Запись Шестерёнкина: «Вилка упала в розетку.\n  Лампа не горит — нет 220В или цепь разомкнута».\n2 ● Настрой voltage: впиши 220. Настрой fuse_closed:\n  нажми ⇄ — стало true (цепь замкнута).\n3 ● Запусти «Запустить механизм». Лампа зажглась!\n  Первая загадка решена. (этап 1)\n4 ● Опыт: поставь voltage = 300, запусти.\n  Лампа «перегорает». Почему? Верни 220.\n5 ● Настрой wire_temp → 45, breaker_reset → true.\n6 ● Проверь: нажми «Проверить настройки» (этап 2).\n7 ● Калибровка: resistance → 10, current → 2.0.\n  Нажми «Калибровка». Параметры идеальны!',cfg:{LIGHT_CONFIG:{power_supply:{type:'b',v:true,edit:'toggle'},voltage:{type:'n',v:110,step:10,min:0,max:300,edit:'manual'},fuse_closed:{type:'b',v:false,edit:'toggle'},wire_temp:{type:'n',v:25,step:5,min:0,max:200,edit:'manual'},bulb_power:{type:'n',v:60,step:10,min:10,max:200,edit:'manual'},safety_guard:{type:'b',v:true,edit:'toggle'},resistance:{type:'n',v:10,step:1,min:1,max:50,edit:'manual'},current:{type:'n',v:2,step:0.5,min:0,max:10,edit:'manual'},phase_switch:{type:'b',v:false,edit:'toggle'},breaker_reset:{type:'b',v:true,edit:'toggle'}}},check:{voltage:220,fuse_closed:true,power_supply:true},check2:{wire_temp:[30,60],bulb_power:[40,100],safety_guard:true,breaker_reset:true},check3:{resistance:[8,15],current:[1.5,3]},hint:'Крутите напряжение до 220 и включите предохранитель fuse_closed.'},
{num:3,nm:'Стакан воды',kind:'goal',sc:'hydra',goal:'Налить воды в стакан',desc:'Бак с краном, под ним поворотный жёлоб, внизу мерный стакан. Вода попадёт в стакан, если кран открыт, а угол жёлоба от 15 до 35 градусов.',task:'Откройте кран и настройте угол жёлоба от <b>15</b> до <b>35</b>.',ch:'═══ ЦЕХ 3 · ГИДРАВЛИКА ═══\n1 ● Запись №2: «Бак полон, кран закрыт.\n  Вода не течёт — нужен открытый вентиль\n  и правильный наклон лотка, чтобы струя\n  попала прямо в стакан».\n2 ● Открой valve_open: нажми ⇄ → true.\n  pipe_angle поставь 25 — между 15 и 35.\n3 ● Запусти «Запустить механизм». Капли наполняют\n  стакан. (этап 1)\n4 ● Опыт: поставь pipe_angle = 5, запусти.\n  Вода льётся мимо. Верни 25.\n5 ● Настрой flow_pressure → 5, filter_open → true.\n6 ● Проверь: нажми «Проверить настройки» (этап 2).\n7 ● Калибровка: nozzle_size → 4, pump_rpm → 50.\n  Затем «Калибровка» (этап 3). Отлично!',cfg:{FLUID_CONFIG:{valve_open:{type:'b',v:false,edit:'toggle'},pipe_angle:{type:'n',v:5,step:5,min:0,max:45,edit:'manual'},flow_pressure:{type:'n',v:2,step:1,min:0,max:10,edit:'manual'},tank_level:{type:'n',v:80,step:5,min:0,max:100,edit:'manual'},drip_rate:{type:'n',v:5,step:1,min:1,max:20,edit:'manual'},filter_open:{type:'b',v:true,edit:'toggle'},nozzle_size:{type:'n',v:4,step:1,min:1,max:10,edit:'manual'},hose_length:{type:'n',v:5,step:1,min:1,max:15,edit:'manual'},pump_rpm:{type:'n',v:30,step:5,min:0,max:100,edit:'manual'},spill_sensor:{type:'b',v:false,edit:'toggle'}}},check:{valve_open:true,pipe_angle:[15,35]},check2:{flow_pressure:[3,7],tank_level:[60,100],filter_open:true,spill_sensor:false},check3:{nozzle_size:[3,6],pump_rpm:[40,60]},hint:'Открой valve_open и поднимай pipe_angle до 15-35.'},
{num:4,nm:'Ящик',kind:'goal',sc:'jump',goal:'Поймать шар в ящик',desc:'Крутой трамплин обрывается над пропастью. Мяч летит по баллистической параболе — крышка ящика захлопнется, если ловушка активна и датчик стоит в зоне 4.2-4.7.',task:'Включите ловушку и поставьте датчик в зону <b>4.2-4.7</b>.',ch:'═══ ЦЕХ 4 · БАЛЛИСТИКА ═══\n1 ● Запись №3: «Мяч летит с трамплина в пустоту.\n  Ящик ловит его, но крышка должна захлопнуться\n  в нужный момент. Датчик срабатывает в зоне 4.2–4.7».\n2 ● Настрой trap_door_active: впиши true.\n  trigger_x поставь 4.5 — середина зоны.\n3 ● Запусти «Запустить механизм». Мяч летит\n  по параболе, крышка хлоп — мяч в ящике! (этап 1)\n4 ● Опыт: поставь trigger_x = 1.2, запусти.\n  Крышка закрывается рано — мяч падает мимо.\n5 ● Настрой catch_speed → 6, wind_comp → true.\n6 ● Проверь: нажми «Проверить настройки» (этап 2).\n7 ● Калибровка: net_tension → 5, drop_height → 3.\n  Затем «Калибровка» (этап 3). Отлично!',cfg:{CATCH_CONFIG:{trap_door_active:{type:'b',v:false,edit:'manual'},trigger_x:{type:'n',v:1.2,step:0.5,min:0,max:6,edit:'manual'},catch_speed:{type:'n',v:5,step:1,min:0,max:10,edit:'manual'},latch_spring:{type:'n',v:7,step:1,min:0,max:10,edit:'manual'},auto_reset:{type:'b',v:false,edit:'toggle'},beep_alarm:{type:'b',v:false,edit:'toggle'},net_tension:{type:'n',v:5,step:1,min:0,max:10,edit:'manual'},drop_height:{type:'n',v:3,step:1,min:0,max:8,edit:'manual'},wind_comp:{type:'b',v:false,edit:'toggle'},return_timer:{type:'n',v:2,step:1,min:1,max:8,edit:'manual'}}},check:{trap_door_active:true,trigger_x:[4.2,4.7]},check2:{catch_speed:[4,8],latch_spring:[5,9],wind_comp:true,return_timer:[2,5]},check3:{net_tension:[4,7],drop_height:[2,5]},hint:'Активируй ловушку и подвигай trigger_x до 4.2-4.7.'},
{num:5,nm:'Сейф',kind:'goal',sc:'safe',goal:'Раскодировать сейф',desc:'Рельс упирается в бронированный сейф с латунным лимбом. Дверь откроется, если пароль-строка верный и включён байпас.',task:'Напишите код-слово и включите байпас.',ch:'═══ ЦЕХ 5 · КРИПТОГРАФИЯ ═══\n1 ● Запись №4: «Сейф заперт, лимб ждёт команду.\n  Пароль — антоним к «ЗАКРЫТЬ». Плюс нужен\n  аварийный обход защиты — bypass_system».\n2 ● Впиши в поле code: "ОТКРЫТЬ". Настрой\n  bypass_system: нажми ⇄ → true.\n3 ● Запусти «Запустить механизм». Ключ едет,\n  дверь открывается. (этап 1)\n4 ● Опыт: напиши пароль маленькими буквами.\n  Не работает — регистр важен. Верни «ОТКРЫТЬ».\n5 ● Настрой alarm_volume → 5, power_backup → true.\n6 ● Проверь: нажми «Проверить настройки» (этап 2).\n7 ● Калибровка: bolt_time → 3, dial_speed → 4.\n  Нажми «Калибровка» (этап 3). Цех пройден!',cfg:{SAFE_CONFIG:{code:{type:'s',v:'ЗАКРЫТЬ',opts:['ОТКРЫТЬ','ЗАКРЫТЬ'],edit:'manual'},bypass_system:{type:'b',v:false,edit:'toggle'},alarm_volume:{type:'n',v:5,step:1,min:0,max:10,edit:'manual'},lock_attempts:{type:'n',v:3,step:1,min:1,max:10,edit:'manual'},red_light:{type:'b',v:true,edit:'toggle'},power_backup:{type:'b',v:false,edit:'toggle'},bolt_time:{type:'n',v:2,step:1,min:1,max:8,edit:'manual'},dial_speed:{type:'n',v:4,step:1,min:1,max:10,edit:'manual'},keypad_lock:{type:'b',v:false,edit:'toggle'},siren_mode:{type:'b',v:false,edit:'toggle'}}},check:{code:'ОТКРЫТЬ',bypass_system:true},check2:{alarm_volume:[3,7],lock_attempts:[3,6],power_backup:true,keypad_lock:false},check3:{bolt_time:[2,4],dial_speed:[3,6]},hint:'Слово-команда — антоним к «ЗАКРЫТЬ». Впиши его и включи байпас.'},
{num:6,nm:'Шины',kind:'goal',sc:'tire',goal:'Раскрутить шины и сбросить груз',desc:'Скат обрывается над двумя шинами-валиками. Второе колесо заблокировано канатом. Груз уедет, если скорость больше 8 и канат снят.',task:'Разгоните шину выше <b>8</b> и снимите канат.',ch:'═══ ЦЕХ 6 · МЕХАНИКА ═══\n1 ● СМОТРИ: шины, канат на второй, груз сверху.\n  Груз уедет, если скорость > 8 и канат снят.\n2 ● НАСТРОЙ: wheel_speed → 10, unclog_rope → true.\n3 ● ЗАПУСТИ: нажми «Запустить механизм».\n  Шины крутятся, груз падает — этап 1.\n4 ● ЭКСПЕРИМЕНТ: оставь wheel_speed3, канат сними.\n  Груз не уедет — скорость мала. Верни 10.\n5 ● НАСТРОЙ: axle_heat → 60, safety_lock → true.\n6 ● ПРОВЕРЬ: нажми «Проверить настройки» (этап 2).\n7 ● КАЛИБРОВКА: belt_tension → 5, gear_ratio → 3,\n  затем нажми «Калибровка» (этап 3). Идеально!',cfg:{GEAR_CONFIG:{wheel_speed:{type:'n',v:3,step:1,min:0,max:12,edit:'manual'},unclog_rope:{type:'b',v:false,edit:'toggle'},axle_heat:{type:'n',v:40,step:5,min:0,max:200,edit:'manual'},conveyor_grip:{type:'n',v:6,step:1,min:0,max:10,edit:'manual'},auto_brake:{type:'b',v:false,edit:'toggle'},friction_lube:{type:'b',v:false,edit:'toggle'},belt_tension:{type:'n',v:5,step:1,min:0,max:10,edit:'manual'},gear_ratio:{type:'n',v:2,step:1,min:1,max:6,edit:'manual'},safety_lock:{type:'b',v:true,edit:'toggle'},motor_boost:{type:'b',v:false,edit:'toggle'}}},check:{wheel_speed:[9,12],unclog_rope:true},check2:{axle_heat:[40,90],conveyor_grip:[5,8],safety_lock:true,motor_boost:true},check3:{belt_tension:[4,7],gear_ratio:[2,4]},hint:'Разгони wheel_speed выше 8 (до 9-12) и сними канат unclog_rope.'},
{num:7,nm:'Пинг-понг',kind:'goal',sc:'paddle',goal:'Шарик в цель',desc:'В пустоте каскадом висят 4 наклонные ракетки. Белый шарик пружинит по ним в чашку, если упругость от 0.7 до 0.95.',task:'Настройте упругость от <b>0.7</b> до <b>0.95</b>.',ch:'═══ ЦЕХ 7 · УПРУГОСТЬ ═══\n1 ● СМОТРИ: 4 ракетки каскадом, внизу чашка.\n  Шарик пружинит по ним — нужна упругость 0.7–0.95.\n2 ● НАСТРОЙ: bounciness → 0.8, wind_force → 0.\n3 ● ЗАПУСТИ: нажми «Запустить механизм».\n  Шарик отскакивает и падает в чашку — этап 1.\n4 ● ЭКСПЕРИМЕНТ: поставь bounciness = 0.4, запусти.\n  Шарик не допрыгивает. Верни 0.8.\n5 ● НАСТРОЙ: table_friction → 4, edge_guard → true.\n6 ● ПРОВЕРЬ: нажми «Проверить настройки» (этап 2).\n7 ● КАЛИБРОВКА: paddle_angle → 5, air_drag → 2,\n  затем нажми «Калибровка» (этап 3). Идеально!',cfg:{PINGPONG_CONFIG:{bounciness:{type:'n',v:0.4,step:0.1,min:0,max:1,edit:'manual'},wind_force:{type:'n',v:0,step:0.1,min:0,max:1,edit:'manual'},table_friction:{type:'n',v:3,step:1,min:0,max:10,edit:'manual'},ball_mass:{type:'n',v:3,step:1,min:1,max:10,edit:'manual'},spin_effect:{type:'n',v:0,step:1,min:0,max:10,edit:'manual'},net_height:{type:'n',v:4,step:1,min:0,max:10,edit:'manual'},paddle_angle:{type:'n',v:5,step:1,min:0,max:10,edit:'manual'},air_drag:{type:'n',v:2,step:1,min:0,max:10,edit:'manual'},sweet_spot:{type:'b',v:false,edit:'toggle'},edge_guard:{type:'b',v:true,edit:'toggle'}}},check:{bounciness:[0.7,0.95],wind_force:0},check2:{table_friction:[2,5],ball_mass:[2,5],edge_guard:true,sweet_spot:true},check3:{paddle_angle:[4,7],air_drag:[1,3]},hint:'Подними bounciness до 0.7-0.95, ветер оставь 0.'},
{num:8,nm:'Водопад',kind:'goal',sc:'pipe',goal:'Вода в нужное место',desc:'Трубная магистраль с двумя насосами (А и Б). Вода попадёт в бассейн, только если оба насоса включены, а слив закрыт.',task:'Включите оба насоса и закройте слив.',ch:'═══ ЦЕХ 8 · ФИНАЛ ═══\n1 ● Запись №1: Два насоса, общая магистраль.\n  Профессор Шестерёнкин: «Вода пойдёт, только если\n  оба насоса работают вместе. Одиночка не пройдёт».\n2 ● Настрой pump_A и pump_B: нажми ⇄ → true.\n  drain_system переведи в false — слив закрыт.\n3 ● Запусти «Запустить механизм». Лейка льёт,\n  уровень воды растёт. Цель достигнута! (этап 1)\n4 ● Опыт: выключи один насос, запусти снова.\n  Воды нет. Вывод: И (AND) — оба должны быть true.\n5 ● Настрой water_tank → 75, relief_valve → true.\n6 ● Проверь: нажми «Проверить настройки» (этап 2).\n7 ● Калибровка: vapor_vent → 3, pipe_capacity → 6,\n  затем «Калибровка» (этап 3). Цех пройден!',cfg:{FINAL_CONFIG:{pump_A_power:{type:'b',v:false,edit:'toggle'},pump_B_power:{type:'b',v:false,edit:'toggle'},drain_system:{type:'b',v:true,edit:'toggle'},water_tank:{type:'n',v:50,step:5,min:0,max:100,edit:'manual'},pressure_psi:{type:'n',v:30,step:5,min:0,max:100,edit:'manual'},filter_flow:{type:'n',v:8,step:1,min:1,max:10,edit:'manual'},vapor_vent:{type:'n',v:3,step:1,min:0,max:10,edit:'manual'},pipe_capacity:{type:'n',v:6,step:1,min:1,max:12,edit:'manual'},relief_valve:{type:'b',v:true,edit:'toggle'},water_recirc:{type:'b',v:false,edit:'toggle'}}},check:{pump_A_power:true,pump_B_power:true,drain_system:false},check2:{water_tank:[60,90],pressure_psi:[40,70],relief_valve:true,water_recirc:true},check3:{vapor_vent:[2,5],pipe_capacity:[5,8]},hint:'Включи pump_A и pump_B, а drain_system переведи в false (закрыть слив).'}
];

const KEYS=["1_СТАРТ","2_ВЕНТ","3_МАГН","4_ОПТИ","5_ПОРШ","6_РЕДУ","7_МОСТ","8_ЛИФТ","9_ПРЕС","10_КЛАП","11_ВОРО","12_АКСЕ"];
const NN=["Старт","Вентиль","Магнит","Оптика","Поршень","Редуктор","Мост","Лифт","Пресс","Клапан","Ворота","Аксел"];

let lvlIdx=0, eng="", t0=0, tint=null, tms=0;
let L=LVLS[0], conf={}, wanted={};
const lg=document.getElementById('lg'),sb=document.getElementById('sb'),chs=document.getElementById('chs'),chd=document.getElementById('chd'),pb=document.getElementById('pb'),cnt=document.getElementById('cnt'),astTxt=document.getElementById('ast'),taskTxt=document.getElementById('task'),linfo=document.getElementById('lvl-info'),ta=document.getElementById('ta'),hl=document.getElementById('hl'),ln=document.getElementById('ln'),chips=document.getElementById('chips');

/* ---------- ИМЯ ---------- */
let savedName=localStorage.getItem('ws_name');
if(savedName){eng=savedName;document.getElementById('en').textContent=eng}
const FACTS=[
  '🔲 true и false — это булевы значения. Названы в честь математика Джорджа Буля (XIX век)',
  '🔲 1 бит = одно значение true/false. В 1 байте помещается 8 булевых флагов',
  '🔲 В языке JavaScript есть «ленивые» операторы: && и || вычисляют вторую часть только если надо',
  '🔲 false == 0 и true == 1 в JS при нестрогом сравнении, но false !== 0 строго',
  '🔲 Пустая строка "", 0, null, undefined и NaN — всё это «falsy» (ложноподобные) значения',
  '🔲 Оператор !!x превращает любое значение в true или false («двойное отрицание»)',
  '🔲 Булева алгебра — основа всех микросхем: транзисторы работают как ключи true/false',
  '🔲 Логические схемы И (AND), ИЛИ (OR), НЕ (NOT) можно собрать из одних лишь NAND-элементов'
];
function showGate(){
  const gi=document.getElementById('gate-inner');
  const nameSec=savedName?`<p style="font-size:11px;color:var(--metal);margin-bottom:8px">С возвращением, <b style="color:var(--light)">${savedName}</b>!</p><button class="b2 sm" onclick="window.resetName()">Другое имя</button>`
    :`<label for="si">Подпись юного инженера</label><input type="text" id="si" placeholder="Ваше имя..." maxlength="16" autocomplete="off"/>`;
  const fact=FACTS[Math.floor(Math.random()*FACTS.length)];
  gi.innerHTML=`<h1>Мастерская <span>Шестеренкина</span></h1><div class="slv">Уровень ${L.num} &middot; ${L.nm}</div>
  <div class="sd">${L.desc}</div><div class="spat">ЦЕЛЬ: ${L.goal}</div>
  <div style="font-size:10px;color:var(--accent);background:var(--dark);border-radius:6px;padding:6px 10px;margin-bottom:8px;line-height:1.5;border:1px solid var(--border);font-family:'JetBrains Mono',monospace">${fact}</div>${nameSec}
  <button class="b2" onclick="window.enterW()">${savedName?'Продолжить':'Войти в мастерскую'}</button>`;
  document.getElementById('gate').style.transform='translateY(0)';
  if(!savedName)setTimeout(()=>{const si=document.getElementById('si');if(si)si.focus()},150);
}
window.resetName=function(){localStorage.removeItem('ws_name');eng='';document.getElementById('en').textContent='—';savedName=null;showGate()};
window.enterW=function(){
  let n=savedName;
  if(!n){const si=document.getElementById('si');n=si?si.value.trim():'';if(n.length<2){alert("Введите имя!");return}}
  eng=n;savedName=eng;localStorage.setItem('ws_name',eng);document.getElementById('en').textContent=eng;
  document.getElementById('gate').style.transform='translateY(-105%)';
  lg.textContent='% Добро пожаловать, '+eng+'! Выполните ЦЕЛЬ уровня и запустите механизм.';
};

/* ---------- КОНФИГ/КОД ---------- */
function initLevel(){
  L=LVLS[lvlIdx];
  if(L.kind==='nodes'){
    wanted={};conf={};KEYS.forEach((k,i)=>{wanted[k]=(i===0)?true:(L.w==='all'?true:false);conf[k]=(i===0)?true:false});
  }else{
    conf={};const ck=Object.keys(L.cfg)[0];const defs=L.cfg[ck];conf[ck]={};
    Object.keys(defs).forEach(k=>{conf[ck][k]=defs[k].v});
  }
}
function codeText(){
  if(L.kind==='nodes'){
    return '// Включите все узлы: true = пропускает шар\nLVL1_CONFIG = {\n'+KEYS.map((k,i)=>'    "'+k+'": '+(conf[k]?'true':'false')+(i<11?',':'')).join('\n')+'\n};';
  }
  const ck=Object.keys(L.cfg)[0];const defs=L.cfg[ck];
  const hints=(L.ch||L.task).split('\n');
  const line=hints.map(h=>'// '+h).join('\n');
  const body=Object.keys(defs).map((k,i)=>{
    const d=defs[k];let v=conf[ck][k];
    if(d.type==='b')v=v?'true':'false';
    else if(d.type==='s')v='"'+v+'"';
    else v=v;
    return '    "'+k+'": '+v+(i<Object.keys(defs).length-1?',':'');
  }).join('\n');
  return line+'\n'+ck+' = {\n'+body+'\n};';
}
function esc2(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function hc(t){return esc2(t).replace(/([A-Z_]{3,}_CONFIG)/g,'<span class="kw">$1</span>').replace(/(\{|\}|;|,)/g,'<span class="op">$1</span>').replace(/("[^"]*")/g,'<span class="st">$1</span>').replace(/(\/\/.*)/g,'<span class="cm">$1</span>').replace(/\btrue\b/g,'<span class="tr">true</span>').replace(/\bfalse\b/g,'<span class="fa">false</span>').replace(/\b(\d+\.?\d*)\b/g,'<span class="br">$1</span>')}
function sync(){hl.innerHTML=hc(ta.value)+'\n';ln.innerHTML=Array.from({length:Math.max(ta.value.split('\n').length,15)},(_,i)=>i+1).join('<br>')}
ta.addEventListener('input',sync);
ta.addEventListener('scroll',function(){
  hl.style.transform='translateY(-'+ta.scrollTop+'px) translateX(-'+ta.scrollLeft+'px)';
  ln.scrollTop=ta.scrollTop;
});
function rebuildEdit(){
  ta.value=codeText();sync();
  ta.scrollTop=0;ta.scrollLeft=0;
  hl.style.transform='translateY(0) translateX(0)';
  ln.scrollTop=0;
  chips.innerHTML='';
  if(L.kind==='nodes'){
    for(let i=1;i<=12;i++){
      const k=KEYS[i-1];
      const t=document.createElement('span');t.className='chip'+(conf[k]?' val-good':' val-bad-chip');t.innerHTML='<span class="pn">Узел '+i+'</span><span class="pv '+(conf[k]?'val-ok':'val-bad')+'">'+(conf[k]?'true':'false')+'</span>';t.onclick=()=>{conf[k]=!conf[k];rebuildEdit()};
      chips.appendChild(t);
    }
  }else{
    const ck=Object.keys(L.cfg)[0];const defs=L.cfg[ck];const chval=L.check||{};
    Object.keys(defs).forEach(k=>{
      const d=defs[k];const box=document.createElement('span');box.className='chip';
      const e=chval[k];
      let phTxt='';
      // статус-индикатор слева
      const setChipStatus=()=>{
        const cv=conf[ck][k];
        const ok=d.type==='b'?cv===e:(Array.isArray(e)?cv>=e[0]&&cv<=e[1]:cv===e);
        box.className='chip'+(ok?' val-good':e!==undefined?' val-bad-chip':'');
      };
      setChipStatus();
      if(d.type==='b'){phTxt=e!==undefined?('введи '+(e?'true':'false')):'введи true или false'}
      else if(d.type==='n'){phTxt=Array.isArray(e)?('введи от '+e[0]+' до '+e[1]):('введи '+(e!==undefined?e:'значение'))}
      else if(d.type==='s'){phTxt=e!==undefined?'введи текст и Enter':'введи текст и Enter'}
      // имя параметра
      const pn=document.createElement('span');pn.className='pn';pn.textContent=shortKey(k);
      box.appendChild(pn);
      // ПОЛЕ ВВОДА (всегда)
      const inp=document.createElement('input');inp.type='text';inp.className='ci';
      inp.placeholder=phTxt;
      inp.value=(d.type==='s')?'"'+conf[ck][k]+'"':String(conf[ck][k]);
      const flashChip=()=>{box.classList.remove('flash');void box.offsetWidth;box.classList.add('flash')};
      const commit=()=>{
        const raw=inp.value.trim().replace(/^"|"$/g,'');
        if(d.type==='b'){
          if(/^(true|1|on)$/i.test(raw))conf[ck][k]=true;
          else if(/^(false|0|off)$/i.test(raw))conf[ck][k]=false;
        }else if(d.type==='n'){
          const v=parseFloat(raw.replace(',','.'));
          if(!isNaN(v))conf[ck][k]=Math.min(d.max,Math.max(d.min,Math.round(v*10)/10));
        }else{conf[ck][k]=raw;}
        ta.value=codeText();sync();
        inp.value=(d.type==='s')?'"'+conf[ck][k]+'"':String(conf[ck][k]);
        inp.classList.toggle('val-ok',cfgOk(d,conf[ck][k],e));
        inp.classList.toggle('val-bad',!cfgOk(d,conf[ck][k],e));
        setChipStatus();
      };
      const cfgOk=(dd,v,target)=>{
        if(Array.isArray(target))return v>=target[0]&&v<=target[1];
        return v===target;
      };
      inp.classList.toggle('val-ok',cfgOk(d,conf[ck][k],e));
      inp.classList.toggle('val-bad',!cfgOk(d,conf[ck][k],e));
      inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();commit();flashChip();}});
      inp.addEventListener('blur',commit);
      box.appendChild(inp);
      // КНОПКИ рядом с полем: bool — переключатель, число — −/+
      if(d.type==='b'){
        const tg=document.createElement('span');tg.className='pmn';tg.textContent='⇄';
        tg.title='переключить true/false';
        tg.onclick=()=>{conf[ck][k]=!conf[ck][k];ta.value=codeText();sync();inp.value=conf[ck][k]?'true':'false';inp.classList.toggle('val-ok',cfgOk(d,conf[ck][k],e));inp.classList.toggle('val-bad',!cfgOk(d,conf[ck][k],e));flashChip();setChipStatus();};
        box.appendChild(tg);
      }else if(d.type==='n'){
        const mn=document.createElement('span');mn.className='pmn';mn.textContent='−';
        mn.onclick=()=>{conf[ck][k]=Math.max(d.min,Math.round((conf[ck][k]-d.step)*10)/10);ta.value=codeText();sync();inp.value=String(conf[ck][k]);setChipStatus();};
        const pl=document.createElement('span');pl.className='ppl';pl.textContent='+';
        pl.onclick=()=>{conf[ck][k]=Math.min(d.max,Math.round((conf[ck][k]+d.step)*10)/10);ta.value=codeText();sync();inp.value=String(conf[ck][k]);setChipStatus();};
        box.appendChild(mn);box.appendChild(pl);
      }else{ // строка — только ручной ввод, без подсказки и перебора
        // цикл вариантов убран: пароль надо написать самому
      }
      chips.appendChild(box);
    });
  }
}
function shortKey(k){return k.replace(/_/g,' ')}
function parseC(){
  try{
    let returnExpr;
    if(L.kind==='nodes')returnExpr='return LVL1_CONFIG;';
    else{const ck=Object.keys(L.cfg)[0];returnExpr='return (typeof '+ck+'!=="undefined")?'+ck+':null;'}
    const fn=new Function(ta.value+'; '+returnExpr);
    const p=fn();
    if(p&&typeof p==='object'){
      if(L.kind==='nodes'){KEYS.forEach(k=>{if(p[k]!==undefined)conf[k]=p[k]})}
      else{const ck=Object.keys(L.cfg)[0];const defs=L.cfg[ck];Object.keys(defs).forEach(k=>{if(p[k]!==undefined)conf[ck][k]=p[k]})}
      return true;
    }
  }catch(e){lg.textContent='% Ошибка: проверьте скобки, кавычки и запятые!';return false}
  return false;
}
function checkGoal(){
  if(L.kind==='nodes'){
    for(let i=1;i<12;i++){if(conf[KEYS[i]]!==true)return{ok:false,msg:'Узел '+NN[i]+' закрыт (false). Нужно true!'}}
    return{ok:true};
  }
  const ck=Object.keys(L.cfg)[0];const c=conf[ck]||{};const ch=L.check;
  const keys=Object.keys(ch);
  for(const k of keys){
    const expect=ch[k];const got=c[k];
    if(Array.isArray(expect)){
      if(!(got>=expect[0]&&got<=expect[1]))return{ok:false,msg:'Параметр '+shortKey(k)+' = '+got+'. Нужно в диапазоне '+expect[0]+'-'+expect[1]+'!'};
    }else{
      if(got!==expect)return{ok:false,msg:'Неверно! У параметра '+shortKey(k)+' стоит '+(typeof got==='string'?'"'+got+'"':got)+'. Проверь подсказки в заданиях выше.'};
    }
  }
  return{ok:true};
}

function doCheck(data,okMsg){
  if(!eng){showGate();return}
  if(run||crash)return;
  if(!parseC())return;
  if(!data||L.kind==='nodes'){lg.textContent='% Для этого этапа нет проверок.';return}
  const ck=Object.keys(L.cfg)[0];const c=conf[ck]||{};
  const keys=Object.keys(data);
  for(const k of keys){
    const expect=data[k];const got=c[k];
    if(Array.isArray(expect)){
      if(!(got>=expect[0]&&got<=expect[1]))return(badMsg(shortKey(k),got,expect[0]+'-'+expect[1]));
    }else{if(got!==expect)return badMsg(shortKey(k),got,expect)}
  }
  lg.textContent='% '+okMsg;
  lg.style.color='';
}
function badMsg(name,got,want){
  lg.textContent='% Параметр "'+name+'" = '+got+'. Нужно: '+want;
  lg.style.color='var(--bad)';
  return false;
}

    else if(L.num===6){y=3.2-i*0.12;if(i===6)y=0.8;if(i===7)y=0.2}      // 6: скат + шины внизу

  else if(L.num===4&&goalObjs){ball.position.set(-3.8,goalObjs.rampTop-Math.tan(goalObjs.rampAngle)*(-3.8-goalObjs.rampX0)+0.15,0);ball.userData.vx=SPD*1.2;ball.userData.vy=0;ball.userData.flight=false}
  else if(L.num===5&&goalObjs){ball.position.set(-3.0,goalObjs.safeY+0.1,0);ball.userData.vx=SPD*1.2;ball.userData.vy=0}
  else if(L.num===6&&goalObjs){ball.position.set(goalObjs.cx-1.2,goalObjs.cy+0.6,0);ball.userData.vx=SPD;ball.userData.vy=0}
  else if(L.num===7&&goalObjs){ball.position.set(goalObjs.cupX-3.5,1.5,0);ball.userData.vx=.04;ball.userData.vy=0;ball.userData.init=false;ball.userData.bounces=0}
  else if(L.num===8&&goalObjs){ball.position.set(goalObjs.cx-1.5,0.6,0);ball.userData.vx=SPD;ball.userData.vy=0}
  else{ball.position.set(-6.5,4,0);ball.userData.vx=SPD;ball.userData.vy=0}
  setActorColor(0x8a6a4a);
  if(L.kind==='nodes'){

  sb.textContent='Расчет...';lg.textContent='% Механизм запущен. Шар катится к цели.';
  pb.style.width='0%';tone(600,.1);

};

/* ---------- АНИМАЦИЯ ---------- */
let time=0;
function anim(){
  requestAnimationFrame(anim);time+=.016;const t=time;
  du.rotation.y+=.0002;

  // ---- Idle-анимации сцен ----
  if(L.num===7&&goalObjs&&goalObjs.pads){
    goalObjs.pads.forEach((p,i)=>{if(!run)p.rotation.z=(i%2===0?.18:-.18)+Math.sin(t*0.8+i)*.02});
  }
  if(L.num===6&&goalObjs&&goalObjs.wheelA&&!run)goalObjs.wheelA.rotation.z+=Math.sin(t*2)*.003;
  if(L.num===6&&goalObjs&&goalObjs.wheelB&&!run)goalObjs.wheelB.rotation.z+=Math.sin(t*2.1)*.003;
  if(L.num===2&&targetObj){
    const filIdle=targetObj.children.find(c=>c.geometry&&c.geometry.type==='CylinderGeometry'&&c.material.type==='MeshBasicMaterial');
    if(filIdle&&!run&&!winAnim)filIdle.material.color.setHex(0x33220a);
  }
  // water shimmer idle for scene 3
  if(L.num===3&&goalObjs&&goalObjs.tankWater&&!run){
    goalObjs.tankWater.position.y=-0.05+Math.sin(t*1.5)*0.008;
  }
  if(L.num===8&&goalObjs&&goalObjs.water&&!run){
    const wt=goalObjs.water;wt.material.opacity=.6+Math.sin(t*2)*.1;
  }

  if(L.kind==='nodes'){
    nodes.forEach((n,i)=>{
      const a=conf[n.key]===true;
      if(a){n.ind.material.color.setHex(0x4a9a5a);n.ind.material.emissive.setHex(0x2a6a2a);n.ind.material.emissiveIntensity=.4+.3*Math.sin(t*3+i)}
      else{n.ind.material.color.setHex(0x6a4a3a);n.ind.material.emissive.setHex(0);n.ind.material.emissiveIntensity=0}
      if(n.piv){ // барьер-мост: true -> палочка падает как мостик под наклоном (вперёд)
        n.piv.rotation.z+=((a?1.35:0) - n.piv.rotation.z)*.09;
      }else{
        n.bar.position.y+=(a?-.09:.18-n.bar.position.y)*.08;
      }
    });
  }else{
    nodes.forEach((n,i)=>{
      n.ind.material.color.setHex(0x6a4a3a);n.ind.material.emissive.setHex(0);n.ind.material.emissiveIntensity=0;
    });
  }

  if(run){
    const b=ball;
    // ---- анимация теннисного мяча (вращение полос) ----
    if(L.num===4&&actorExtra&&actorExtra.tennis&&b.userData.flight){
      actorExtra.tennis.rotation.x+=.15;
      actorExtra.tennis.rotation.z+=.08;
    }
    // ---- вращение шарика пинг-понга ----
    if(L.num===7&&b.children.length){
      const pp=b.children[0];
      if(pp.geometry&&pp.geometry.type==='SphereGeometry')pp.rotation.x+=.05;
      if(pp.geometry&&pp.geometry.type==='SphereGeometry')pp.rotation.z+=.03;
    }
    // ---- СЦЕНАРИИ ДВИЖЕНИЯ ----
    if(L.num===1||L.kind==='nodes'){ // 1: шар катится по лесенке
      b.userData.vy-=.004;b.userData.vy*=.995;
      b.userData.vx+=(SPD-b.userData.vx)*.04;
      b.position.x+=b.userData.vx;b.position.y+=b.userData.vy;
      if(b.children.length&&b.children[0].geometry.type==='SphereGeometry')b.children[0].rotation.z-=b.userData.vx*3;
    }else if(L.num===2){ // 2: вилка падает на розетку
      b.userData.vy-=.006;b.userData.vy*=.99;
      b.position.y+=b.userData.vy;
      if(b.position.y<=-0.1){ // штыри вошли в гнёзда
        b.position.y=-0.1;b.userData.vy=0;
        const r=checkGoal();
        if(r.ok){winLevel();sparks(b.position,20);tone(880,.15);lg.textContent='% Лампа загорелась! Цепь замкнута.'}
        else{failLevel(r.msg);return}
      }
    }else if(L.num===3&&goalObjs){ // 3: ПОТОК КАПЕЛЬ — шар не участвует
      // поворачиваем жёлоб по pipe_angle из кода
      const ch3=conf.FLUID_CONFIG||{};const ang=Math.min(Math.max(ch3.pipe_angle||5,0),60);
      const chute3=deco.find(d=>d.userData&&d.userData.isChute);
      if(chute3)chute3.rotation.z=-ang*Math.PI/180;
      // вода в баке колышется
      if(goalObjs.tankWater)goalObjs.tankWater.position.y=-0.05+Math.sin(t*2)*0.01;
      // поверхность воды в стакане — рябь
      if(goalObjs.waterTop){
        const wt=goalObjs.waterTop;
        wt.scale.x=1+Math.sin(t*3)*.08;
        wt.scale.y=1+Math.cos(t*3.7)*.08;
        wt.material.opacity=.4+Math.sin(t*4)*.15;
      }
      // генерируем капли из крана — с мерцанием
      dropTimer++;
      if(dropTimer%14===0&&waterDrops.length<50){
        const dr=new THREE.Mesh(new THREE.SphereGeometry(.07,10,10),new THREE.MeshStandardMaterial({color:0x4a9ad8,roughness:.2,metalness:0,transparent:true,opacity:.85}));
        dr.position.set(goalObjs.tipX,goalObjs.tipY,0);
        dr.userData={vx:0,vy:0,onChute:false};sc.add(dr);waterDrops.push(dr);
      }
      // физика капель
      const chPivotX=goalObjs.chutePivotX,chPivotY=goalObjs.chutePivotY,chLen=goalObjs.chuteLen;
      const chEndX=chPivotX+Math.cos(ang*Math.PI/180)*chLen;
      const chEndY=chPivotY-Math.sin(ang*Math.PI/180)*chLen;
      for(let i=waterDrops.length-1;i>=0;i--){
        const dr=waterDrops[i];
        if(!dr.userData.onChute){
          // падение из крана вниз на жёлоб
          dr.userData.vy-=.008;
          dr.position.x+=dr.userData.vx;dr.position.y+=dr.userData.vy;
          // коснулась жёлоба? (прямая от шарнира до конца жёлоба)
          const t=((dr.position.x-chPivotX)*Math.cos(ang*Math.PI/180)+(-(dr.position.y-chPivotY))*Math.sin(ang*Math.PI/180)); // проекция на жёлоб
          if(t>0&&t<chLen){
            // верхняя поверхность жёлоба: толщина 0.05 -> верх на +0.025 от оси pivot
            const lineY=chPivotY-(t)*Math.sin(ang*Math.PI/180)+0.025;
            if(dr.position.y<=lineY&&dr.userData.vy<0){
              dr.position.y=lineY;dr.userData.vy=0;dr.userData.onChute=true;dr.userData.t=t;
            }
          }
        }else{
          // скольжение по жёлобу к концу
          dr.userData.t=(dr.userData.t||0)+0.045;
          const t=Math.min(dr.userData.t,chLen);
          dr.position.x=chPivotX+Math.cos(ang*Math.PI/180)*t;
          dr.position.y=chPivotY-Math.sin(ang*Math.PI/180)*t;
          if(t>=chLen){
            // слетела с конца — баллистический полёт
            dr.userData.onChute=false;dr.userData.t=0;
            dr.userData.vx=Math.cos(ang*Math.PI/180)*0.05;
            dr.userData.vy=-Math.sin(ang*Math.PI/180)*0.05;
            dr.position.x=chEndX;dr.position.y=chEndY;
          }
        }
        if(!dr.userData.onChute&&dr.userData.t===0){
          // свободный полёт (уже после срыва или если не попала на жёлоб)
          dr.userData.vy-=.008;dr.userData.vy*=.995;
          dr.position.x+=dr.userData.vx;dr.position.y+=dr.userData.vy;
        }
        // попала в стакан?
        if(dr.position.x>=goalObjs.glassX-0.32&&dr.position.x<=goalObjs.glassX+0.32&&dr.position.y<=goalObjs.glassTopY&&dr.position.y>=goalObjs.glassBottomY){
          sc.remove(dr);waterDrops.splice(i,1);waterCaptured++;
          // вода заполняет стакан от ДНА: масштаб считаем от текущего fill
if(goalObjs.water){
            const w=goalObjs.water;
            const f=Math.min(.55,w.userData.fill+.045);
            w.userData.fill=f;
            const h=0.06+f*1.0;
            w.scale.y=Math.max(.06,h);
            w.position.y=goalObjs.glassBottomY+h/2;
            // поверхность воды следует за уровнем
            if(goalObjs.waterTop){goalObjs.waterTop.position.y=goalObjs.glassBottomY+h}
          }
          if(waterCaptured===12){
            const r=checkGoal();
            if(r.ok)winLevel();else failLevel(r.msg);
            return;
          }
          continue;
        }
        // промах (улетела вниз)
        if(dr.position.y<-14||dr.position.x>goalObjs.glassX+1.8){sc.remove(dr);waterDrops.splice(i,1);waterMissed++}
      }
      // если вода льётся мимо и НИ ОДНА капля не попала — промах
      if(waterMissed>4&&waterCaptured===0){
        failLevel('Вода льётся мимо стакана! Проверьте угол жёлоба (15-35).');return;
      }
    }else if(L.num===4&&goalObjs){ // 4: воздушный мяч по баллистике, крышка захлопывается
      const ca4=conf.CATCH_CONFIG||{};
      // условие: ловушка активна И trigger_x в 4.2-4.7
      const lidOk=ca4.trap_door_active===true&&ca4.trigger_x>=4.2&&ca4.trigger_x<=4.7;
      // крышка плавно падает при ok, иначе поднята
      if(goalObjs.lidPiv){
        const tZ=lidOk?1.5:0;
        goalObjs.lidPiv.rotation.z+=(tZ-goalObjs.lidPiv.rotation.z)*.06;
      }
      // лёгкий мяч катится ПО ПОВЕРХНОСТИ доски, затем слетает с её края
      if(!b.userData.flight){ // на доске
        b.userData.vx+=(SPD*1.5-b.userData.vx)*.04;
        b.position.x+=b.userData.vx;
        const surfY=goalObjs.rampTop-Math.tan(goalObjs.rampAngle)*(b.position.x-goalObjs.rampX0);
        const targetY=surfY+0.2;
        b.position.y+=(targetY-b.position.y)*0.6;
        if(b.position.x>=goalObjs.trampEndX){
          b.userData.flight=true;b.userData.vx=.15;b.userData.vy=.06;
        }
      }else{ // свободный полёт по параболе
        b.userData.vy-=.015;
        b.position.x+=b.userData.vx;b.position.y+=b.userData.vy;
        b.userData.vx*=.998;
      }
      // проверка попадания в ящик — широкая зона ловли
      const inBoxX=b.position.x>=goalObjs.boxX-0.7&&b.position.x<=goalObjs.boxX+0.6;
      const inBoxY=b.position.y<=goalObjs.boxTopY+0.4;
      if(inBoxX&&inBoxY){
        if(lidOk){
          winLevel();sparks(b.position,20);lg.textContent='% Мяч пойман! Крышка захлопнулась.';
          b.position.y=-99;
        }else{failLevel('Крышка не сработала! Включите ловушку и поставьте датчик 4.2-4.7.');}
        return;
      }
      if(b.position.y<-14){failLevel('Мяч пролетел мимо ящика! Проверьте датчик (4.2-4.7).');return}
    }else if(L.num===5&&goalObjs){ // 5: латунный ключ едет к сейфу, при верном коде дверь открывается
      const sa5=conf.SAFE_CONFIG||{};
      const open5=sa5.code==='ОТКРЫТЬ'&&sa5.bypass_system===true;
      // лимб крутится при попытке открыть
      if(goalObjs.dial)goalObjs.dial.rotation.z+=open5?0:.15;
      // ключ едет вправо к сейфу
      b.userData.vx+=(SPD*1.2-b.userData.vx)*.04;
      b.position.x+=b.userData.vx;
      b.position.y=goalObjs.safeY+0.1; // едет по полу
      // дверь плавно открывается при верном коде
      if(goalObjs.doorPiv){
        const tR=open5?-2.0:0; // раскрытие влево
        goalObjs.doorPiv.rotation.y+=(tR-goalObjs.doorPiv.rotation.y)*.06;
      }
      // ключ дошёл до сейфа
      if(b.position.x>=goalObjs.safeX-0.3){
        const r=checkGoal();
        if(r.ok){winLevel();sparks(b.position,20);lg.textContent='% Сейф открыт! Код принят.';b.position.y=-99;}
        else{failLevel(r.msg);}
        return;
      }
    }else if(L.num===6&&goalObjs){ // 6: груз падает на шину и уезжает (честная физика, проверка после
      const g6=conf.GEAR_CONFIG||{};
      const spin=g6.wheel_speed>8;
      const cut=g6.unclog_rope===true;
      goalObjs.runT=(goalObjs.runT||0)+1/60;
      // канат: плавно ослабляем витки (масштаб/смещение) при unclog, затем скрываем
      if(goalObjs.rope){
        if(cut){
          goalObjs.rope.scale.y=Math.max(.2,goalObjs.rope.scale.y-.05);
          goalObjs.rope.position.y-=.06;
          if(goalObjs.rope.scale.y<=.25){sc.remove(goalObjs.rope);goalObjs.rope=null;}
        }else{
          goalObjs.rope.rotation.z=Math.sin(t*6)*.05; // канат дрожит, застрял
        }
      }
      // шины крутятся (ускоряются при spin)
      const wSpeed=spin?(0.12+goalObjs.runT*.03):0;
      if(goalObjs.wheelA)goalObjs.wheelA.rotation.z+=wSpeed;
      if(goalObjs.wheelB)goalObjs.wheelB.rotation.z+=wSpeed;
      // ГРУЗ: висит высоко, при снятии каната + скорости падает на шину и уезжает
      if(goalObjs.boxLoad){
        const b6=goalObjs.boxLoad;
        if(cut&&spin){
          // шина вращается — груз отпускают: падает на шину (tireTopY) и уезжает вперёд
          const topY=goalObjs.tireTopY||(goalObjs.cy-0.02);
          if(b6.position.y>topY){b6.position.y-=.04;}
          else{
            b6.position.y=topY;
            b6.position.x+=.06; // подхват шиной, едет вперёд
            b6.rotation.z=.08;
          }
        }
      }
      // оцениваем код после ~2.5 сек анимации
      if(goalObjs.runT>2.5){
        const r=checkGoal();
        if(r.ok)winLevel();else failLevel(r.msg);
        return;
      }
    }else if(L.num===7&&goalObjs){ // 7: шарик пинг-понга падает по каскаду
      const g7=conf.PINGPONG_CONFIG||{};
      const bounce=Math.min(Math.max(g7.bounciness||0.4,0),1);
      if(!b.userData.init){b.userData.vy=-.055;b.userData.init=true;b.userData.hit={}}
      b.userData.vy-=.003;
      b.position.y+=b.userData.vy;
      b.position.x+=.08;
      if(goalObjs.pads){
        goalObjs.pads.forEach((p,i)=>{
          if(!b.userData.hit[i]&&Math.abs(b.position.x-p.position.x)<.5&&Math.abs(b.position.y-p.position.y)<.35&&b.userData.vy<0){
            b.userData.vy=Math.abs(b.userData.vy*.7)*bounce;
            b.position.y=p.position.y+.18;
            b.userData.hit[i]=true;
            b.userData.bounces=(b.userData.bounces||0)+1;
          }
        });
      }
      // упал в чашку — успех/ошибка
      if(b.position.x>=goalObjs.cupX-.25&&b.position.x<=goalObjs.cupX+.25&&b.position.y<=goalObjs.cupY+.1){
        const r=checkGoal();
        if(r.ok)winLevel();else failLevel(r.msg);
        return;
      }
      // улетел вниз мимо чашки — проигрыш
      if(b.position.y<-4){failLevel('Шарик упал мимо! Настройте упругость (0.7-0.95).');return}
    }else if(L.num===8&&goalObjs){ // 8: насосы качают, лейка поливает, вода поднимается
      const g8=conf.FINAL_CONFIG||{};
      const ok8=g8.pump_A_power===true&&g8.pump_B_power===true&&g8.drain_system===false;
      goalObjs.runT=(goalObjs.runT||0)+1/60;
      // струя из лейки видна/скрыта в зависимости от насосов
      if(goalObjs.jet){
        const jm=goalObjs.jet.material;
        jm.opacity=ok8?(0.5+0.15*Math.sin(t*10)):0.05;
        goalObjs.jet.scale.y=ok8?1:0.2;
      }
      if(goalObjs.water){
        // вода растёт только при верном коде — от дна бассейна
        const f=Math.min(.8,goalObjs.water.userData.fill+(ok8?.02:0));
        goalObjs.water.userData.fill=f;
        const h=0.06+f*0.9;
        goalObjs.water.scale.y=Math.max(.06,h);
        goalObjs.water.position.y=-0.53+h/2;
        // поверхность воды — рябь
        if(goalObjs.waterTop){
          const wt=goalObjs.waterTop;
          wt.scale.x=1+Math.sin(t*2.5)*.06;
          wt.scale.y=1+Math.cos(t*3.2)*.06;
          wt.position.y=-0.53+h/2;
          wt.material.opacity=.3+Math.sin(t*3)*.15;
        }
      }
      // после 2 сек — оцениваем код
      if(goalObjs.runT>2.0){
        const r=checkGoal();
        if(r.ok)winLevel();else failLevel(r.msg);
        return;
      }
    }else{ // 3-8: объект движется к финишу
      b.userData.vy-=.004;b.userData.vy*=.995;
      b.userData.vx+=(SPD-b.userData.vx)*.04;
      b.position.x+=b.userData.vx;b.position.y+=b.userData.vy;
    }

    if(L.kind==='nodes'&&cur<12){
      const n=nodes[cur];
      if(n){
        if(b.position.y<=n.surfY&&b.position.x>=n.x-.65&&b.position.x<=n.x+.7){b.position.y=n.surfY;b.userData.vy=0}
        if(b.position.x>=n.x+.62){
          if(conf[n.key]===true){
            cur++;pb.style.width=(cur/12*100)+'%';cnt.textContent=cur+'/12';
            sparks(b.position,10);tone(700+cur*25,.05);
            lg.textContent='% '+n.name+' пройден ('+cur+'/12)';
            if(cur>=12)winLevel();
          }else{
            failLevel('Узел '+n.name+' закрыт (false). Нужно true!');
          }
        }
      }
    }else if(L.kind==='goal'){
      const n=nodes[nodes.length-1];
      if(n&&b.position.x>=targetX-0.4){
        const r=checkGoal();
        if(r.ok)winLevel();
        else failLevel(r.msg);
      }else{
        // держать на последней платформе
        const last=nodes[nodes.length-1];
        if(last&&b.position.y<=last.surfY&&b.position.x>=last.x-.65){b.position.y=last.surfY;b.userData.vy=0}
      }
    }
    if(L.num!==3)trailPts.push(b.position.clone());if(trailPts.length>120)trailPts.shift();trail.geometry.setFromPoints(trailPts);
  }

  // Анимации победы целей
  if(winAnim>0){
    winAnim+=.016;
    if(L.num===1&&targetObj){targetObj.rotation.y+=.03;if(winAnim>2)winAnim=0}
    if(L.num===2&&targetObj){
      const fil=targetObj.children.find(c=>c.geometry.type==='CylinderGeometry'&&c.material.type==='MeshBasicMaterial');
      const glow=targetObj.children.find(c=>c.material&&c.material.type==='MeshBasicMaterial'&&c.material.color.getHex()===0xffdd44);
      if(fil){fil.material.color.setHex(0xffcc22);if(glow){glow.material.opacity=.5+Math.sin(winAnim*8)*.3;glow.scale.setScalar(1+Math.sin(winAnim*8)*.2)}}
    }
    if(L.num===3&&targetObj){targetObj.scale.y=Math.min(1,targetObj.scale.y+.05);if(winAnim>2)winAnim=0}
    if(L.num===4&&targetObj){targetObj.rotation.x+=.06;if(targetObj.rotation.x>1.1)targetObj.rotation.x=1.1}
    if(L.num===5&&targetObj){const dial=targetObj.children.find(c=>c.geometry.type==='CylinderGeometry');if(dial)dial.rotation.z+=.12;const door=targetObj.children.find(c=>c.position.z>.3);if(door)door.rotation.y=Math.min(1.3,door.rotation.y+.04)}
    if(L.num===6&&targetObj){const tire=targetObj.children.find(c=>c.geometry.type==='CylinderGeometry');if(tire)tire.rotation.z+=.3}
    if(L.num===7&&targetObj){targetObj.rotation.y+=.06}
    if(L.num===8&&targetObj){targetObj.scale.y=Math.min(1,targetObj.scale.y+.06);if(goalObjs.waterTop)goalObjs.waterTop.material.opacity=.6+Math.sin(winAnim*6)*.3}
  }

  if(crash){ball.position.y-=.05;ball.position.x+=.01;if(ball.position.y<-12)crash=false}
  if(ss.material.opacity>0){
    ss.material.opacity-=.015;const pa=ss.geometry.attributes.position.array,vl=ss.userData.vel;
    for(let i=0;i<sn2;i++){pa[i*3]+=vl[i].x;pa[i*3+1]+=vl[i].y;pa[i*3+2]+=vl[i].z;vl[i].y-=.012;vl[i].x*=.98;vl[i].z*=.98}
    ss.geometry.attributes.position.needsUpdate=true;
  }

  /* ---------- КАМЕРА ---------- */
function updateCamera(t){
  if(L.num===2){
    const tx=targetX;
    cam.position.x+=(tx-cam.position.x)*.06;
    cam.position.y+=(1.4-cam.position.y)*.06;
    cam.position.z+=(6.2-cam.position.z)*.06;
    cam.lookAt(tx,0.2,0);
  }else if(L.num===3&&goalObjs){
    const cx=(goalObjs.tipX+goalObjs.glassX)/2;
    const cy=(goalObjs.tipY+goalObjs.glassTopY-1.2)/2;
    cam.position.x+=(cx-cam.position.x)*.06;
    cam.position.y+=(cy+1.2-cam.position.y)*.06;
    cam.position.z+=(6.8-cam.position.z)*.06;
    cam.lookAt(cx,cy,0);
  }else if(L.num===4&&goalObjs){
    const midX=(goalObjs.trampEndX+goalObjs.boxX)/2;
    const followX=ball.position.x*0.7+midX*0.3;
    const fy=Math.max(0.3,ball.position.y*0.6);
    const tx=cam.position.x+(followX+0.3-cam.position.x)*.04;
    const ty=cam.position.y+(fy+0.6-cam.position.y)*.04;
    cam.position.set(tx,ty,6.8);
    cam.lookAt(tx*0.6+followX*0.4,Math.max(-0.2,fy-0.3),0);
  }else if(L.num===5&&goalObjs){
    const sx=goalObjs.safeX;
    cam.position.x+=((sx-0.5)-cam.position.x)*.06;
    cam.position.y+=(0.6-cam.position.y)*.06;
    cam.position.z+=(5.5-cam.position.z)*.06;
    cam.lookAt(sx,0.0,0);
  }else if(L.num===6&&goalObjs){
    const cx=goalObjs.cx;
    cam.position.x+=((cx-0.2)-cam.position.x)*.06;
    cam.position.y+=(0.4-cam.position.y)*.06;
    cam.position.z+=(5.2-cam.position.z)*.06;
    cam.lookAt(cx+0.3,0.0,0);
  }else if(L.num===7&&goalObjs){
    const cx=goalObjs.cupX-1.4;
    cam.position.x+=(cx-cam.position.x)*.06;
    cam.position.y+=(-0.1-cam.position.y)*.06;
    cam.position.z+=(6.0-cam.position.z)*.06;
    cam.lookAt(cx+0.3,0.1,0);
  }else if(L.num===8&&goalObjs){
    const cx=goalObjs.cx;
    cam.position.x+=((cx+0.2)-cam.position.x)*.06;
    cam.position.y+=(0.5-cam.position.y)*.06;
    cam.position.z+=(5.8-cam.position.z)*.06;
    cam.lookAt(cx+0.5,-0.1,0);
  }else{
    const tx=ball.position.x*.3;
    cam.position.x+=(tx-cam.position.x)*.005;
    cam.lookAt(tx,-1,0);
  }
}
updateCamera(t);
cmp.render();
}

window.addEventListener('resize',()=>{const w2=vp.clientWidth,h2=vp.clientHeight;cam.aspect=w2/h2;cam.updateProjectionMatrix();ren.setSize(w2,h2);cmp.setSize(w2,h2)});

loadLevel(0);anim();
</script>
</body>
